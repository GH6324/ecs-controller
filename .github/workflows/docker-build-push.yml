name: Docker Image Build and Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ecs-controller

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push controller image
      uses: docker/build-push-action@v5
      with:
        context: ./
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        build-args: |
          ECS_VERSION=sha-${{ github.sha }}
          ECS_COMMIT=${{ github.sha }}
          ECS_BUILD_DATE=${{ github.event.head_commit.timestamp }}

    - name: Build and Push updater image
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: ./docker/updater.Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/ecs-controller-updater:latest
          ${{ secrets.DOCKER_USERNAME }}/ecs-controller-updater:updater-sha-${{ github.sha }}
